name: evals

on:
  push:
  pull_request:

jobs:
  offline:
    # Free and deterministic: unit tests + retrieval metrics. Runs on every push/PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python evaluate.py --retrieval-only

  full:
    # Calls Claude, so it costs money: only on main, and only if the secret is set.
    needs: offline
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Full eval (generation + LLM judge)
        if: env.ANTHROPIC_API_KEY != ''
        run: python evaluate.py
      - uses: actions/upload-artifact@v4
        if: always() && env.ANTHROPIC_API_KEY != ''
        with:
          name: eval-report
          path: reports/latest.json
